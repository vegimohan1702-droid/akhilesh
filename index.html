<!DOCTYPE html>
<html>
<head>
    <title>Temperature Converter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(120deg, #2193b0, #6dd5ed);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 20px #555;
        }

        h1 {
            color: #2193b0;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background: #2193b0;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #176b85;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            color: #2193b0;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌡️ Temperature Converter</h1>

    <input type="number" id="temp"
           placeholder="Enter temperature">

    <select id="from">
        <option value="C">Celsius</option>
        <option value="F">Fahrenheit</option>
        <option value="K">Kelvin</option>
    </select>

    <p>Convert To</p>

    <select id="to">
        <option value="F">Fahrenheit</option>
        <option value="C">Celsius</option>
        <option value="K">Kelvin</option>
    </select>

    <button onclick="convert()">Convert</button>

    <p id="result">Result will appear here</p>

</div>

<script>
function convert() {

    let temp = parseFloat(document.getElementById("temp").value);

    let from = document.getElementById("from").value;
    let to = document.getElementById("to").value;

    if (isNaN(temp)) {
        document.getElementById("result").innerHTML =
            "Please enter a temperature!";
        return;
    }

    let celsius;

    if (from == "C") {
        celsius = temp;
    }
    else if (from == "F") {
        celsius = (temp - 32) * 5 / 9;
    }
    else {
        celsius = temp - 273.15;
    }

    let answer;

    if (to == "C") {
        answer = celsius;
    }
    else if (to == "F") {
        answer = (celsius * 9 / 5) + 32;
    }
    else {
        answer = celsius + 273.15;
    }

    if (celsius < -273.15) {
        document.getElementById("result").innerHTML =
            "Temperature below absolute zero is invalid!";
        return;
    }

    document.getElementById("result").innerHTML =
        "Result: " + answer.toFixed(2) + " " + to;
}
</script>

</body>
</html>
